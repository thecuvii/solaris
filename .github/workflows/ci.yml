name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          cache: true
          node-version: 26
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test --run
      - run: vp pack
      - run: vp -C website build
      - run: npm pack --dry-run
