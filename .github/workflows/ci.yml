name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          cache: true
          node-version: 26
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          cache: true
          node-version: 26
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp test --run
      - run: vp pack
      - run: npm pack --dry-run

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          cache: true
          node-version: 26
          run-install: false
      - run: corepack enable
      - run: vp install --frozen-lockfile
      - run: vp run --filter website build

  bundle-size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          cache: true
          node-version: 26
          run-install: false
      - run: corepack enable
      - run: vp install --frozen-lockfile
      - run: vp pack
      - run: node scripts/check-bundle-size.mjs
      - if: github.event_name == 'pull_request'
        uses: preactjs/compressed-size-action@2.10.0
        with:
          build-script: build
          install-script: vp install --frozen-lockfile
          pattern: dist/**/*.mjs
          repo-token: ${{ github.token }}
          sort-by: Size:desc
