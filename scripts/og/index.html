<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solaris — OG composition</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      .artwork {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        isolation: isolate;
        background: #000;
      }
      .sky {
        position: absolute;
        left: -75px;
        top: -30px;
        width: 1350px;
        height: 730px;
      }
    </style>
  </head>
  <body>
    <main class="artwork" aria-label="A small sun in a hazy sky">
      <div class="sky" id="sky" aria-hidden="true"></div>
    </main>
    <script type="module" src="./scene.js"></script>
  </body>
</html>
